name: Build Rukn Luxury APK

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build & Publish Rukn APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Configure Google Maven Central Mirror & Force Unified Kotlin Stdlib
        run: |
          git -C "$FLUTTER_ROOT" checkout -- . || true
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"
          allprojects {
              buildscript {
                  repositories {
                      maven { url mirrorUrl }
                      google()
                  }
                  configurations.all {
                      resolutionStrategy.eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                              details.useVersion '1.8.22'
                          }
                      }
                  }
              }
              repositories {
                  maven { url mirrorUrl }
                  google()
              }
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          gradle.beforeProject { project ->
              project.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def u = repo.url.toString()
                      if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                          repo.setUrl(mirrorUrl)
                      }
                  }
              }
              project.buildscript.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def u = repo.url.toString()
                      if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                          repo.setUrl(mirrorUrl)
                      }
                  }
              }
          }
          EOF

      - name: Cache Permanent Android Signing Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/rukn_fixed.keystore
          key: rukn-fixed-signing-keystore-permanent-v1

      - name: Generate Fixed Keystore (If Not Cached)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/rukn_fixed.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/rukn_fixed.keystore \
              -alias rukn_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storepass rukn123456 \
              -keypass rukn123456 \
              -dname "CN=Rukn Luxury App, OU=Gulf Edition, O=Rukn, L=Riyadh, S=Riyadh, C=SA"
          fi

      - name: Assemble Clean Flutter Project Structure
        run: |
          mkdir -p /tmp/rukn_source_lib
          for f in $(find . -maxdepth 3 -name "*.dart"); do
            cp "$f" /tmp/rukn_source_lib/
          done

          rm -rf build_workspace
          mkdir -p build_workspace
          cd build_workspace

          flutter create --org com.rukn --project-name rukn_app --platforms=android .
          rm -rf lib/*
          cp /tmp/rukn_source_lib/*.dart lib/

          echo "Verified Dart files in lib/:"
          ls -la lib/

          for req in main.dart gulf_themes.dart luxury_ui.dart smart_arabic_engine.dart storage_vault.dart share_card_studio.dart settings_screen.dart home_screen.dart editor_screen.dart; do
            if [ ! -f "lib/$req" ]; then
              echo "ERROR: Missing required file lib/$req"
              exit 1
            fi
          done

      - name: Download Luxury Arabic Fonts (Static Lightweight TTFs)
        run: |
          cd build_workspace
          mkdir -p assets/fonts

          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Regular.ttf" -o assets/fonts/Almarai-Regular.ttf
          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Bold.ttf" -o assets/fonts/Almarai-Bold.ttf
          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-ExtraBold.ttf" -o assets/fonts/Almarai-ExtraBold.ttf

          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf" -o assets/fonts/Tajawal-Regular.ttf
          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Medium.ttf" -o assets/fonts/Tajawal-Medium.ttf
          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf" -o assets/fonts/Tajawal-Bold.ttf
          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-ExtraBold.ttf" -o assets/fonts/Tajawal-ExtraBold.ttf

          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf" -o assets/fonts/Amiri-Regular.ttf
          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf" -o assets/fonts/Amiri-Bold.ttf

          curl -L -s --retry 5 "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o assets/fonts/Cairo-Regular.ttf

      - name: Write pubspec.yaml
        run: |
          cat << 'EOF' > build_workspace/pubspec.yaml
          name: rukn_app
          description: رُكْن - المفكرة العربية الفاخرة
          publish_to: 'none'
          version: 2.1.0+2

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.3
            path_provider: ^2.1.3
            share_plus: ^9.0.0
            archive: ^3.6.1
            intl: ^0.19.0
            hijri: ^3.0.0
            wakelock_plus: ^1.2.5

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/fonts/

            fonts:
              - family: Cairo
                fonts:
                  - asset: assets/fonts/Cairo-Regular.ttf
              - family: Almarai
                fonts:
                  - asset: assets/fonts/Almarai-Regular.ttf
                    weight: 400
                  - asset: assets/fonts/Almarai-Bold.ttf
                    weight: 700
                  - asset: assets/fonts/Almarai-ExtraBold.ttf
                    weight: 800
              - family: Tajawal
                fonts:
                  - asset: assets/fonts/Tajawal-Regular.ttf
                    weight: 400
                  - asset: assets/fonts/Tajawal-Medium.ttf
                    weight: 500
                  - asset: assets/fonts/Tajawal-Bold.ttf
                    weight: 700
                  - asset: assets/fonts/Tajawal-ExtraBold.ttf
                    weight: 800
              - family: Amiri
                fonts:
                  - asset: assets/fonts/Amiri-Regular.ttf
                    weight: 400
                  - asset: assets/fonts/Amiri-Bold.ttf
                    weight: 700
          EOF

      - name: Configure Android Native Files, Luxury Icon & MediaStore PNG/ZIP Support
        run: |
          cd build_workspace

          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.rukn.app"
              compileSdk 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {
                  applicationId "com.rukn.app"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 2
                  versionName "2.1.0"
                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a'
                  }
              }

              signingConfigs {
                  release {
                      storeFile file("${System.getProperty('user.home')}/.android/rukn_fixed.keystore")
                      storePassword "rukn123456"
                      keyAlias "rukn_key"
                      keyPassword "rukn123456"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source "../.."
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF

          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/rukn_luxury_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B132B"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#162447"
                  android:pathData="M14,14h80v80h-80z"/>
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M54,14 L94,54 L54,94 L14,54 Z M54,22 L22,54 L54,86 L86,54 Z"/>
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M36,36 h36 v6 h-36 z M36,50 h36 v6 h-36 z M36,64 h24 v6 h-24 z"/>
              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M70,62 L78,70 L64,84 L56,84 L56,76 Z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.rukn.app">
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="رُكْن"
                  android:name="${applicationName}"
                  android:icon="@drawable/rukn_luxury_icon"
                  android:roundIcon="@drawable/rukn_luxury_icon"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/kotlin/com/rukn/app
          cat << 'EOF' > android/app/src/main/kotlin/com/rukn/app/MainActivity.kt
          package com.rukn.app

          import android.content.ContentValues
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.rukn.app/vault_channel"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "saveToDownloads") {
                          val fileName = call.argument<String>("fileName") ?: "Rukn_File"
                          val bytes = call.argument<ByteArray>("bytes")
                          val mimeType = call.argument<String>("mimeType") ?: "application/octet-stream"

                          if (bytes == null) {
                              result.error("INVALID_BYTES", "Bytes are null", null)
                              return@setMethodCallHandler
                          }

                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  val resolver = applicationContext.contentResolver
                                  val contentValues = ContentValues().apply {
                                      put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                                      put(MediaStore.MediaColumns.MIME_TYPE, mimeType)
                                      put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Rukn_Backups")
                                  }
                                  val uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, contentValues)
                                  if (uri != null) {
                                      resolver.openOutputStream(uri)?.use { out ->
                                          out.write(bytes)
                                          out.flush()
                                      }
                                      result.success("Downloads/Rukn_Backups/$fileName")
                                  } else {
                                      result.error("URI_NULL", "Could not create MediaStore entry", null)
                                  }
                              } else {
                                  val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Rukn_Backups")
                                  if (!dir.exists()) dir.mkdirs()
                                  val outFile = File(dir, fileName)
                                  FileOutputStream(outFile).use { out ->
                                      out.write(bytes)
                                      out.flush()
                                  }
                                  result.success(outFile.absolutePath)
                              }
                          } catch (e: Exception) {
                              result.error("SAVE_ERROR", e.message, null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Build Lightweight Signed Release APK (ARM64 + ARMv7 Only)
        run: |
          cd build_workspace
          flutter pub get
          flutter build apk --release --target-platform android-arm64,android-arm --tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../Rukn-Luxury-Gulf-Notepad.apk
          ls -lh ../Rukn-Luxury-Gulf-Notepad.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rukn-Luxury-APK
          path: Rukn-Luxury-Gulf-Notepad.apk
          if-no-files-found: error

      - name: Publish Direct One-Click APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest Rukn-Luxury-Gulf-Notepad.apk \
            --title "رُكْن (Rukn) - الإصدار الفاخر المحدث v2.1" \
            --notes "تحميل مباشر بضغطة واحدة لملف تثبيت تطبيق رُكْن (APK) بدون ضغط." \
            --clobber || \
          gh release upload latest Rukn-Luxury-Gulf-Notepad.apk --clobber
