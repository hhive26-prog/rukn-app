name: Build & Publish Rukn Luxury APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle Mirror & Kotlin Resolution (Zero-Conflict Mode)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"

          gradle.settingsEvaluated { settings ->
              settings.pluginManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def u = repo.url.toString()
                      if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                          repo.url = URI.create(mirrorUrl)
                      }
                  }
              }
              settings.dependencyResolutionManagement.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def u = repo.url.toString()
                      if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                          repo.url = URI.create(mirrorUrl)
                      }
                  }
              }
          }

          allprojects {
              buildscript {
                  repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository) {
                          def u = repo.url.toString()
                          if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                              repo.url = URI.create(mirrorUrl)
                          }
                      }
                  }
              }
              repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def u = repo.url.toString()
                      if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                          repo.url = URI.create(mirrorUrl)
                      }
                  }
              }
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Cache Permanent Android Signing Keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/rukn_fixed.keystore
          key: rukn-fixed-signing-keystore-permanent-v1

      - name: Generate Fixed Signing Keystore (If Not Cached)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/rukn_fixed.keystore \
            -alias rukn_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -storepass rukn123456 \
            -keypass rukn123456 \
            -dname "CN=Rukn Luxury App, OU=Mobile, O=Rukn, L=Riyadh, S=Riyadh, C=SA"

      - name: Prepare Clean Flutter Workspace & Assets
        run: |
          mkdir -p build_workspace
          cd build_workspace
          flutter create --org com.rukn --project-name rukn_app --platforms=android .

          rm -rf lib/*
          cp -r "$GITHUB_WORKSPACE/lib/"* lib/

          # التوافق التلقائي سواء كانت الأكواد 8 ملفات أو 7 ملفات
          if grep -q "class EditorScreen" lib/home_screen.dart; then
            echo "export 'home_screen.dart';" > lib/editor_screen.dart
          fi

          mkdir -p assets/fonts
          BASE_FONT_URL="https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl -L -s --retry 5 "$BASE_FONT_URL/amiri/Amiri-Regular.ttf" -o assets/fonts/Amiri-Regular.ttf
          curl -L -s --retry 5 "$BASE_FONT_URL/amiri/Amiri-Bold.ttf" -o assets/fonts/Amiri-Bold.ttf
          curl -L -s --retry 5 "$BASE_FONT_URL/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o assets/fonts/Cairo-Regular.ttf
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf
          curl -L -s --retry 5 "$BASE_FONT_URL/tajawal/Tajawal-Regular.ttf" -o assets/fonts/Tajawal-Regular.ttf
          curl -L -s --retry 5 "$BASE_FONT_URL/tajawal/Tajawal-Bold.ttf" -o assets/fonts/Tajawal-Bold.ttf
          curl -L -s --retry 5 "$BASE_FONT_URL/almarai/Almarai-Regular.ttf" -o assets/fonts/Almarai-Regular.ttf
          curl -L -s --retry 5 "$BASE_FONT_URL/almarai/Almarai-Bold.ttf" -o assets/fonts/Almarai-Bold.ttf
          curl -L -s --retry 5 "$BASE_FONT_URL/scheherazadenew/ScheherazadeNew-Regular.ttf" -o assets/fonts/ScheherazadeNew-Regular.ttf
          curl -L -s --retry 5 "$BASE_FONT_URL/scheherazadenew/ScheherazadeNew-Bold.ttf" -o assets/fonts/ScheherazadeNew-Bold.ttf

          cat << 'EOF' > pubspec.yaml
          name: rukn_app
          description: "رُكْن - المفكرة العربية الفاخرة"
          publish_to: 'none'
          version: 2.2.0+22

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            shared_preferences: ^2.2.3
            path_provider: ^2.1.3
            share_plus: ^9.0.0
            intl: ^0.19.0
            hijri: ^3.0.1
            archive: ^3.6.1
            uuid: ^4.4.0
            wakelock_plus: ^1.2.5
            package_info_plus: ^8.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/fonts/

            fonts:
              - family: Amiri
                fonts:
                  - asset: assets/fonts/Amiri-Regular.ttf
                  - asset: assets/fonts/Amiri-Bold.ttf
                    weight: 700
              - family: Cairo
                fonts:
                  - asset: assets/fonts/Cairo-Regular.ttf
                  - asset: assets/fonts/Cairo-Bold.ttf
                    weight: 700
              - family: Tajawal
                fonts:
                  - asset: assets/fonts/Tajawal-Regular.ttf
                  - asset: assets/fonts/Tajawal-Bold.ttf
                    weight: 700
              - family: Almarai
                fonts:
                  - asset: assets/fonts/Almarai-Regular.ttf
                  - asset: assets/fonts/Almarai-Bold.ttf
                    weight: 700
              - family: ScheherazadeNew
                fonts:
                  - asset: assets/fonts/ScheherazadeNew-Regular.ttf
                  - asset: assets/fonts/ScheherazadeNew-Bold.ttf
                    weight: 700
          EOF

      - name: Configure Android Project, Luxury Icon & Native Bridge
        run: |
          cd build_workspace

          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.8.22" apply false
          }

          include ":app"
          EOF

          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.rukn.app"
              compileSdk 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {
                  applicationId "com.rukn.app"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 22
                  versionName "2.2.0"
              }

              signingConfigs {
                  release {
                      storeFile file("${System.getProperty('user.home')}/.android/rukn_fixed.keystore")
                      storePassword "rukn123456"
                      keyAlias "rukn_key"
                      keyPassword "rukn123456"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source '../..'
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF

          # أيقونة رُكْن الملكية الفاخرة (كحلي ملكي وذهبي)
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/rukn_luxury_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B132B"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#14213D"
                  android:pathData="M54,8L98,54L54,100L10,54Z"/>
              <path
                  android:strokeColor="#D4AF37"
                  android:strokeWidth="2.8"
                  android:fillColor="#00000000"
                  android:pathData="M20,20h68v68h-68z"/>
              <path
                  android:strokeColor="#D4AF37"
                  android:strokeWidth="2.2"
                  android:fillColor="#00000000"
                  android:pathData="M54,12L96,54L54,96L12,54Z"/>
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M65,35 C65,35 67,54 57,64 C49,72 37,73 34,72 C36,68 45,67 51,60 C58,52 57,38 57,38 Z"/>
              <path
                  android:fillColor="#F3E5AB"
                  android:pathData="M54,27L58,31L54,35L50,31Z"/>
          </vector>
          EOF

          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.rukn.app">

              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>

              <application
                  android:label="رُكْن"
                  android:name="${applicationName}"
                  android:icon="@drawable/rukn_luxury_icon"
                  android:roundIcon="@drawable/rukn_luxury_icon"
                  android:requestLegacyExternalStorage="true"
                  android: enableOnBackInvokedCallback="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/kotlin/com/rukn/app
          cat << 'EOF' > android/app/src/main/kotlin/com/rukn/app/MainActivity.kt
          package com.rukn.app

          import android.content.ContentValues
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import androidx.annotation.NonNull
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.BufferedReader
          import java.io.File
          import java.io.FileOutputStream
          import java.io.InputStreamReader

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.rukn.app/native_bridge"
              private var initialExternalFile: Map<String, String>? = null

              override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  handleIncomingIntent(intent)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "saveToDownloads" -> {
                              val fileName = call.argument<String>("fileName") ?: "rukn_file.txt"
                              val bytes = call.argument<ByteArray>("bytes")
                              val mimeType = call.argument<String>("mimeType") ?: "application/octet-stream"
                              if (bytes == null) {
                                  result.error("INVALID", "No bytes provided", null)
                              } else {
                                  val savedPath = saveFileToDownloads(fileName, bytes, mimeType)
                                  result.success(savedPath)
                              }
                          }
                          "getInitialExternalFile" -> {
                              result.success(initialExternalFile)
                              initialExternalFile = null
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handleIncomingIntent(intent)
              }

              private fun handleIncomingIntent(intent: Intent?) {
                  if (intent?.action == Intent.ACTION_VIEW && intent.data != null) {
                      val uri = intent.data!!
                      try {
                          val title = queryFileName(uri) ?: "ملف_خارجي"
                          val inputStream = contentResolver.openInputStream(uri)
                          val reader = BufferedReader(InputStreamReader(inputStream, Charsets.UTF_8))
                          val content = reader.readText()
                          reader.close()
                          initialExternalFile = mapOf("title" to title, "content" to content)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun queryFileName(uri: Uri): String? {
                  var name: String? = null
                  contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                      if (cursor.moveToFirst()) {
                          val idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (idx >= 0) name = cursor.getString(idx)
                      }
                  }
                  return name?.replace(".txt", "", ignoreCase = true)
              }

              private fun saveFileToDownloads(fileName: String, bytes: ByteArray, mimeType: String): String {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val resolver = contentResolver
                          val contentValues = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                              put(MediaStore.MediaColumns.MIME_TYPE, mimeType)
                              put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Rukn")
                          }
                          val uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, contentValues)
                          if (uri != null) {
                              resolver.openOutputStream(uri)?.use { it.write(bytes) }
                              "Downloads/Rukn/$fileName"
                          } else {
                              ""
                          }
                      } else {
                          val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Rukn")
                          if (!dir.exists()) dir.mkdirs()
                          val file = File(dir, fileName)
                          FileOutputStream(file).use { it.write(bytes) }
                          file.absolutePath
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                      ""
                  }
              }
          }
          EOF

      - name: Build Lightweight Mobile Release APK (ARM64 + ARMv7 Only)
        run: |
          cd build_workspace
          flutter pub get
          flutter build apk --release --target-platform android-arm64,android-arm --tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/Rukn-Luxury-Notepad.apk"

      - name: Upload Direct APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rukn-Luxury-Notepad-APK
          path: Rukn-Luxury-Notepad.apk
          if-no-files-found: error

      - name: Publish Direct One-Click APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest Rukn-Luxury-Notepad.apk \
            --title "رُكْن - الإصدار الملكي الفاخر (Rukn v2.2)" \
            --notes "تحميل مباشر بضغطة واحدة لتطبيق رُكْن (ملف APK جاهز للتثبيت والتحديث المباشر بدون فك ضغط)."
