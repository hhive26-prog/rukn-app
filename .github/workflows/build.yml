                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#14213D"
                  android:pathData="M54,8L98,54L54,100L10,54Z"/>
              <path
                  android:strokeColor="#D4AF37"
                  android:strokeWidth="2.8"
                  android:fillColor="#00000000"
                  android:pathData="M20,20h68v68h-68z"/>
              <path
                  android:strokeColor="#D4AF37"
                  android:strokeWidth="2.2"
                  android:fillColor="#00000000"
                  android:pathData="M54,12L96,54L54,96L12,54Z"/>
              <path
                  android:fillColor="#D4AF37"
                  android:pathData="M65,35 C65,35 67,54 57,64 C49,72 37,73 34,72 C36,68 45,67 51,60 C58,52 57,38 57,38 Z"/>
              <path
                  android:fillColor="#F3E5AB"
                  android:pathData="M54,27L58,31L54,35L50,31Z"/>
          </vector>
          EOF

          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.rukn.app">

              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>

              <application
                  android:label="رُكْن"
                  android:name="${applicationName}"
                  android:icon="@drawable/rukn_luxury_icon"
                  android:roundIcon="@drawable/rukn_luxury_icon"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
